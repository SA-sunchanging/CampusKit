# Scrapes every service's OpenTelemetry Prometheus exporter by its Compose DNS name.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: campuskit
    static_configs:
      - targets:
          - gateway:9464
          - identity:9464
          - listing:9464
          - booking:9464
          - rental:9464
          - payment:9464
          - review:9464
          - notification:9464
    relabel_configs:
      # service="listing" instead of instance="listing:9464" on every series.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
