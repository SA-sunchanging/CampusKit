services:
  review:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP: review
    environment:
      OTEL_SERVICE_NAME: review
      # Traces go to Jaeger when the observability profile runs; otherwise they are dropped.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 3005
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret}
      MONGO_URL: mongodb://review_user:review_pass@mongo:27017/review_db
      RENTAL_URL: http://rental:3003
    depends_on:
      mongo:
        condition: service_healthy
