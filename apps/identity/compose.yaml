services:
  identity:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP: identity
    environment:
      OTEL_SERVICE_NAME: identity
      # Traces go to Jaeger when the observability profile runs; otherwise they are dropped.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      DATABASE_URL: postgres://identity_user:identity_pass@postgres:5432/identity_db
      RABBITMQ_URL: amqp://campuskit:campuskit@rabbitmq:5672
      VERIFICATION_CODE_SECRET: ${VERIFICATION_CODE_SECRET:-dev-only-code-secret}
      # The demo sends no email, so the verification code is shown on screen instead.
      DEMO_MODE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
