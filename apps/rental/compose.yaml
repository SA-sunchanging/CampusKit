services:
  rental:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP: rental
    environment:
      PORT: 3003
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      DATABASE_URL: postgres://rental_user:rental_pass@postgres:5432/rental_db
      RABBITMQ_URL: amqp://campuskit:campuskit@rabbitmq:5672
      BOOKING_GRPC_URL: booking:50051
      PAYMENT_URL: http://payment:3004
      RENTAL_SWEEP_INTERVAL_MS: ${RENTAL_SWEEP_INTERVAL_MS:-60000}
      RENTAL_REMINDER_LEAD_MS: ${RENTAL_REMINDER_LEAD_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
