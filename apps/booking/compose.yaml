services:
  booking:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP: booking
    environment:
      OTEL_SERVICE_NAME: booking
      # Traces go to Jaeger when the observability profile runs; otherwise they are dropped.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 50051
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret}
      DATABASE_URL: postgres://booking_user:booking_pass@postgres:5432/booking_db
      HTTP_PORT: 3007
      RABBITMQ_URL: amqp://campuskit:campuskit@rabbitmq:5672
      IDENTITY_URL: http://identity:3001
      LISTING_URL: http://listing:3002
      PAYMENT_URL: http://payment:3004
      RENTAL_URL: http://rental:3003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
