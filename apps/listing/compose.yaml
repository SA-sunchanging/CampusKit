services:
  listing:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP: listing
    environment:
      OTEL_SERVICE_NAME: listing
      # Traces go to Jaeger when the observability profile runs; otherwise they are dropped.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret}
      DATABASE_URL: postgres://listing_user:listing_pass@postgres:5432/listing_db
      RABBITMQ_URL: amqp://campuskit:campuskit@rabbitmq:5672
      BOOKING_GRPC_URL: booking:50051
      IDENTITY_URL: http://identity:3001
      REVIEW_URL: http://review:3005
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
